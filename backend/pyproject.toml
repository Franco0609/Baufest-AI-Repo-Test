[project]
name = "backendapp"
version = "0.1.0"
description = "FastAPI JWT demo backend"
authors = [
    { name = "copilot-swe-agent[bot]", email = "198982749+Copilot@users.noreply.github.com" }
]
requires-python = "^3.12"
dependencies = [
    "fastapi (==0.138.2)",
    "uvicorn (==0.49.0)",
    "python-jose (==3.5.0)",
    "passlib[bcrypt] (==1.7.4)",
    "bcrypt (>=3.2,<4.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
